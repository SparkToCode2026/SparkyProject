<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="site-nav navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand brand" href="../index.html">Sparky<span class="dot">.</span></a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <a class="nav-link" href="../index.html" style="color: var(--ink); font-weight: 500; text-decoration: none;">Home</a>
        <a class="nav-link" href="bookings.html" style="color: var(--ink); font-weight: 500; text-decoration: none;">My stays</a>
        <span class="nav-stay-name" id="navUserName"></span>
        <a class="nav-ghost" href="admin.html">Admin</a>
        <button class="nav-ghost" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="auth-wrap mx-auto">
      <div class="auth-card mb-4">
        <h1>My profile</h1>
        <p class="sub mb-4">Keep your contact details up to date.</p>
        <div id="alertBox"></div>
        <form id="profileForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="profilePhone">Phone</label>
            <input type="tel" class="form-control" id="profilePhone" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="profileAddress">Address</label>
            <input type="text" class="form-control" id="profileAddress" required />
          </div>
          <div class="mb-4">
            <label class="form-label" for="profileDob">Date of birth</label>
            <input type="date" class="form-control" id="profileDob" required />
          </div>
          <button type="submit" class="btn-ink w-100 btn-ink-lg" id="profileSubmit">Save profile</button>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
