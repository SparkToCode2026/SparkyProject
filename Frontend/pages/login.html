<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="site-nav navbar">
    <div class="container">
      <a class="navbar-brand brand" href="../index.html">Sparky<span class="dot">.</span></a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="auth-wrap mx-auto">
      <div class="auth-card mb-4">
        <h1>Welcome back</h1>
        <p class="sub mb-4">Sign in to manage your stays.</p>
        <div id="alertBox"></div>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="loginEmail">Email</label>
            <input type="email" class="form-control" id="loginEmail" required autocomplete="username" />
          </div>
          <div class="mb-4">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn-ink w-100 btn-ink-lg">Sign in</button>
        </form>
      </div>
      <p class="text-center small mb-0" style="color: var(--ink-soft);">
        New here? <a href="register.html">Create an account</a>
      </p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
