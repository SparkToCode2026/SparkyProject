<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Sparky Stay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="../index.html">&larr; Sparky Stay</a>
  </nav>

  <main class="container mt-5">
    <div class="card auth-card mx-auto">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">Create your account</h1>
        <div id="alertBox"></div>
        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" class="form-control" id="regName" required autocomplete="name" />
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="regEmail" required autocomplete="username" />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="regPassword" required minlength="6" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 mb-0 text-center small">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
