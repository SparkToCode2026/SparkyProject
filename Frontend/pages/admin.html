<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin &middot; Sparky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="site-nav navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand brand" href="../index.html">Sparky<span class="dot">.</span></a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <a class="nav-link" href="../index.html" style="color: var(--ink); font-weight: 500; text-decoration: none;">Home</a>
        <span class="nav-stay-name" id="navUserName"></span>
        <button class="nav-ghost" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="admin-shell">
      <aside class="admin-nav" id="adminNav"></aside>
      <section class="admin-panel" id="adminPanel"></section>
    </div>
  </main>

  <div id="entityModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header justify-content-between">
          <h5 class="modal-title" id="entityModalTitle">Edit</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body px-4 pb-4" id="entityModalBody"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" style="position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 2000;">
    <div class="toast-body"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
