<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Booking & Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Sparky Stay</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li id="navBookings" class="nav-item d-none"><a class="nav-link" href="pages/bookings.html">My Bookings</a></li>
          <li id="navLoggedOut">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link" href="pages/login.html">Login</a></li>
              <li class="nav-item"><a class="nav-link" href="pages/register.html">Register</a></li>
            </ul>
          </li>
          <li id="navLoggedIn" class="nav-item d-none">
            <span class="navbar-text me-2" id="navUserName"></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero py-5 text-center text-white">
    <div class="container">
      <h1 class="display-5 fw-bold">Find your perfect stay</h1>
      <p class="lead mb-4">Browse our hotels and book a room in seconds.</p>
      <input id="searchBox" class="form-control form-control-lg mx-auto" style="max-width: 420px;"
             placeholder="Search by city or hotel name... " />
    </div>
  </header>

  <main class="container py-4">
    <div id="hotelGrid" class="row g-4"></div>
    <p id="noResults" class="text-center text-muted d-none mt-4">No hotels match your search.</p>
  </main>

  <div id="bookModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="bookModalTitle">Book a room</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="bookModalBody"></div>
      </div>
    </div>
  </div>

  <footer class="text-center text-muted py-4">
    <small>&copy; 2026 Sparky Stay &mdash; Hotel Booking &amp; Management System</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
