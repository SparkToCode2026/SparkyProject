<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparky Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="site-nav navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand brand" href="index.html">Sparky<span class="dot">.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li id="navBookings" class="nav-item d-none"><a class="nav-link" href="pages/bookings.html">My stays</a></li>
          <li id="navAdmin" class="nav-item d-none"><a class="nav-link" href="pages/admin.html">Admin</a></li>
          <li id="navProfile" class="nav-item d-none"><a class="nav-link" href="pages/profile.html">Profile</a></li>
          <li id="navLoggedOut" class="nav-item"><a class="nav-link" href="pages/login.html">Login</a> <a class="nav-ghost d-inline-block" href="pages/register.html">Get started</a></li>
          <li id="navLoggedIn" class="nav-item d-none">
            <div class="d-flex align-items-lg-center gap-2 flex-wrap">
              <span class="nav-stay-name" id="navUserName"></span>
              <button class="nav-ghost" onclick="logout()">Logout</button>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <p class="hero-kicker">Hotels, made simple</p>
      <h1>Find a place that feels like yours.</h1>
      <p class="lead">Browse our hotels, see the rooms, and book in a few clicks.</p>
      <div class="hero-search">
        <input id="searchBox" type="text" class="form-control" placeholder="Search by city or hotel name…" />
      </div>
    </div>
  </header>

  <main class="container px-4 px-lg-0">
    <div id="promoStrip" class="promo-strip d-none"></div>
    <h2 class="section-title">Hotels</h2>
    <div id="hotelGrid" class="row g-4"></div>
    <p id="noResults" class="text-center text-muted d-none mt-4">No hotels match your search.</p>
  </main>

  <div id="hotelDetailModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header justify-content-between">
          <h5 class="modal-title" id="hotelDetailTitle">Hotel</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body px-4 pb-4" id="hotelDetailBody"></div>
      </div>
    </div>
  </div>

  <div id="bookModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header justify-content-between">
          <h5 class="modal-title" id="bookModalTitle">Book a room</h5>
          <button type="button" class="btn-close" onclick="closeBook()"></button>
        </div>
        <div class="modal-body px-4 pb-4" id="bookModalBody"></div>
      </div>
    </div>
  </div>

<!--  <footer class="site-footer text-center">
    <small>&copy; Sparky</small>
  </footer> -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
